version: "3.7"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  hedgedoc:
    image: ${HEDGEDOC_IMAGE:-quay.io/hedgedoc/hedgedoc:latest}
    environment:
      CMD_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CMD_DOMAIN: ${CMD_DOMAIN}
      CMD_PROTOCOL_USESSL: ${CMD_PROTOCOL_USESSL}
      CMD_URL_ADDPORT: ${CMD_URL_ADDPORT}
      CMD_ALLOW_ANONYMOUS: "false"
      CMD_ALLOW_FREEURLS: "false"
      CMD_ALLOW_EMAIL_REGISTER: "false"
      CMD_AUTHENTICATION: "github"
      CMD_GITHUB_CLIENTID: ${CMD_GITHUB_CLIENTID}
      CMD_GITHUB_CLIENTSECRET: ${CMD_GITHUB_CLIENTSECRET}
    ports:
      - "${PUBLIC_PORT:-6969}:3000"
    volumes:
      - /root/scratchpad/project-blog/_posts:/hedgedoc/_posts

  publisher:
    build: ../project-blog/tools/publisher
    environment:
      HEDGEDOC_BASE: "http://hedgedoc:3000"
      GIT_REPO_DIR: "/workspace"
      BLOG_CONTENT_DIR: "/workspace/project-blog"
      HEDGEDOC_MAP_FILE: "/workspace/project-blog/.hedgedoc-map.yml"
      ALLOWED_EMAILS_FILE: "/etc/oauth2-proxy/emails.txt"
      ADMIN_EMAILS_FILE: "/etc/oauth2-proxy/admins.txt"
      PUBLIC_BLOG_BASE_URL: "https://scratchpad.lol"
      PUBLISHER_ALLOWED_ORIGINS: "https://md.scratchpad.lol"
    volumes:
      - /root/scratchpad:/workspace
      - /etc/oauth2-proxy:/etc/oauth2-proxy:ro
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - hedgedoc

volumes:
  db_data:
